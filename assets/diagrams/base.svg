<svg xmlns="http://www.w3.org/2000/svg" id="figure-template" viewBox="0 0 960 540" role="img" aria-labelledby="figure-template-title figure-template-desc">
  <title id="figure-template-title">Figure title</title>
  <desc id="figure-template-desc">Replace with the supported subject and scope.</desc>
  <defs>
    <style>
      #figure-template { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      #figure-template text { fill: #243247; font-size: 16px; }
      #figure-template .node { fill: #ffffff; stroke: #768397; stroke-width: 1.5; }
      #figure-template .connector { fill: none; stroke: #516176; stroke-width: 1.5; }
    </style>
    <marker id="figure-template-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#516176"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
  <!-- Replace the figure-template prefix, title and description, then add supported semantic groups, connectors and nodes. -->
</svg>
