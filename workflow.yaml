schema_version: "2.0"
skill: km
skill_version: "0.1.0"
purpose: >-
  Ordered procedure for the host AI to build or refresh a project knowledge library.
  It is read as instructions, not executed. The principles in SKILL.md apply to every
  stage; each action names the reference that owns its detailed rules.
resources_base: skill_directory
output_root: docs/official
json_root: docs/official/.cards
figure_root: docs/assets/km
figure_semantics_root: docs/official/.cards/diagrams
defaults:
  document_language: zh-CN
  source_roots: ["."]
  exclude: []
  writing_preferences: []
stages:
  - id: scope
    read: [references/library-state.md, references/diagrams.md]
    inputs: User request, target project rules, current files, existing library state.
    actions:
      - Resolve and verify the target root; keep skill resources separate from project evidence.
      - Read the manifest, last attempt, current document plan (located under library-state.md), and optional configuration as state. Decide initial build, update, or interrupted-attempt recovery from actual files; refuse unsupported state versions.
      - Get the run ID and current time from host tools.
      - Inventory first-party code, configuration, tests, and original documents, including uncommitted and relevant untracked files, with the exclusions in library-state.md.
      - Identify actual source changes, missing sources, and pending coverage by comparing content; timestamps or commits alone are not enough.
      - Compare managed outputs with a trustworthy baseline to find external edits and ownership conflicts.
      - Check which standalone-SVG and rendered-Markdown previews the host can actually perform (diagrams.md); this does not change figure necessity.
    outputs: Target, effective configuration, prior state, run ID, source inventory, change evidence, exclusions, conflicts, and preview capabilities.
    done_if: Target, state, and declared scope are explicit, known omissions are listed, and no incompatible state was accepted. An inventory is not deep analysis.
    on_failure: Preserve existing files; report the missing context or state conflict.

  - id: plan
    read: [references/writing.md, references/design-outlines.md, references/diagrams.md]
    inputs: Source inventory, entrypoints, original design declarations, prior state.
    actions:
      - Trace real entrypoints and major calls to establish boundaries, module roles, data, and state. For long-running services include background work, coordination, and shutdown.
      - Identify business modules and plan each module's article set and the cross-module flow articles (writing.md, module planning). Review the module list against the sources for omissions and unresolved boundaries.
      - Identify design topics from original designs and actual contracts as well as module roles. Plan the required overall article, substantive topic sections, and corresponding independent detailed articles under writing.md; retain their source and anchor map under library-state.md.
      - Decompose source-backed capabilities into concrete functional points and consequential subscenarios, select each design article's category and prescribed outline (design-outlines.md), and retain the overall/detail/answer mapping (library-state.md). Do not replace functional coverage with module, class or topic lists.
      - Plan each design article's reader questions and original sources, actual internal mechanisms, and needed answer scope under writing.md; record article assessments in the document plan (library-state.md). Choose document types and batches from that scope.
      - Assess independent architecture, control, interaction, state/lifecycle, data-lineage, entity, deployment and dependency questions against the type-specific triggers in diagrams.md. Retain eight-type view assessments in diagram-plan.json (diagram-state.md), with needed article uses or concrete no-view reasons; existing flowcharts do not settle other views.
      - For updates, trace affected consumers, shared contracts, and shared figures with all their article uses; widen the analysis when impact cannot be bounded. Reuse the prior architecture only where its evidence still applies.
    outputs: Evidence-grounded architecture, reviewed module and design-topic lists, overall/detail map, article and figure plan, and impact scope.
    done_if: The plan follows actual roles, original design concerns and entrypoints, with an explicit overall path and a section/detail mapping for every design topic; unresolved recognition is recorded, and every design article has a selected outline, planned functional-point coverage, reader questions and per-point figure assessments.
    on_failure: Return to source reading; leave gaps visible instead of filling them with template prose.

  - id: write
    read: [references/authoring.md, references/knowledge-cards.md, references/diagram-state.md]
    inputs: Plan, sources, existing articles, cards and figures, impact scope.
    actions:
      - Work through topic batches, collecting enough original evidence before drafting each topic.
      - Run the authoring.md lifecycle for every new or updated article. Expression editing is its own pass, loading technical-editing.md only after the content check, and is followed by a fact recheck.
      - Draft to the selected design-outlines.md category and writing.md, integrating necessary shared content into each article and retaining local evidence internally. Expand each functional point beyond its index row with actual contracts, ordered mechanisms, consequential branches, state/data effects and failure behavior; check source-grounded normal and alternative walkthroughs using that article alone, and map questions to its own answer sections. Add a bibliography only for Internet material actually used by that article.
      - Create or update cards under knowledge-cards.md with stable IDs, per-field evidence, and article bindings.
      - For each figure, check its semantic list against evidence before drawing the SVG, then check the Markdown embedding and the standalone SVG (diagrams.md, semantic first).
      - Draft the planned overall article and finalize every design-topic section from detailed reading, including its mechanisms, relationships and constraints (writing.md); retain the overall/detail mapping internally rather than adding documentary links, and reconcile the plan when boundaries change.
      - Leave valid unchanged articles untouched; carry unfinished topics and modules forward as pending.
    outputs: Article, card, semantic-list, and SVG candidates with source associations, rendering evidence, change scope, deferred optional figures, and pending work.
    done_if: The overall article has substantive checked sections for every completed design topic and corresponding detailed articles; completed modules have their checked main and needed topic articles; each design article answers its reader questions at detailed depth and contains its required figures; unfinished scope stays pending.
    on_failure: Return factual or structural defects to analysis or drafting; keep unfinished candidates partial.

  - id: check_and_deliver
    read: [references/library-state.md, references/diagram-state.md]
    inputs: All candidates, reused outputs, source associations, navigation, declared coverage, prior manifest.
    actions:
      - Check structure with existing parsing and link tools where available — naming, headings, links, explicit anchors, JSON fields, IDs, card article bindings, and figure ID mappings. Classify link destinations and textual referrals under writing.md; reachability alone does not establish an allowed reference.
      - Check meaning across articles, cards, and figures — terminology, shared contracts, evidence categories, dates, and conclusions.
      - Check coverage against the retained plan and original sources — design-topic recognition, substantive overall sections and independent details, module recognition and article sets, and complete cross-module flows with self-contained participating articles (writing.md). Check repeated shared contracts against their original sources. Keep unfinished scope pending, never silently narrowed.
      - Record the required design_topic_coverage, document_outline, functional_point_coverage, detailed_design_depth, article_figure_coverage, figure_view_coverage, document_naming, document_associations, article_self_containment, and bibliography_usage checks under library-state.md. Review each ordinary article without other documents, checking local answers and the actual use of every Internet reference; then compare against original sources and required view meanings. Names, headings, word counts, figure/type counts or valid links alone do not establish these checks.
      - Check professional presentation on every official page, including reused pages (writing.md), and inspect design contents, chapter hierarchy, tables and image readability in the actual Markdown preview.
      - Check figures under the required checks in diagrams.md, and figure records, ownership, hashes, and article uses under diagram-state.md.
      - Reassess current requirements even when sources are unchanged. Missing required articles or figures and blocking presentation defects cannot take the no-change shortcut.
      - Record tool checks separately from semantic review, then decide coverage_status and validation_status (library-state.md).
      - Repair correctable content, depth and figure gaps in this invocation within SKILL.md's repair limit; return to their source stage and rerun affected checks without a routine user checkpoint.
      - Deliver only with complete coverage, passed required checks, and no blocking conflict, following the publication steps in library-state.md. Otherwise keep the confirmed collection, retain candidates, and record the attempt.
    outputs: Confirmed collection or retained candidates, an updated manifest only after a confirmed delivery, and the attempt record.
    done_if: Actual files and the manifest agree, or the attempt is recorded as unconfirmed with its actual written and pending paths.
    on_failure: Before delivery, return correctable defects to planning or writing within the repair limit; real blockers keep the attempt incomplete. If replacement has failed or been interrupted, stop further replacement and record actual writes and pending work.

report:
  when: After every run, including failed, partial, and no-change runs.
  language: The user's language.
  include:
    - Project, declared scope, exclusions, and created, updated, retired, or reused knowledge with the reuse basis.
    - The overall-design link, design-topic/detail coverage, unresolved module boundaries, missing designs, pending topics or figures, deferred optional figures, and required and candidate check results; actual figure types, necessary views and reasons other views were unnecessary or pending.
    - The Markdown and SVG preview environments actually used and their limits.
    - Which results come from tool checks and which from semantic review; no software runtime or production acceptance claims.
    - A link to docs/official/README.md when a confirmed entrypoint exists, with retained candidates linked separately.
    - Conflicts, interrupted writes, remaining work, and what the next invocation will do.
